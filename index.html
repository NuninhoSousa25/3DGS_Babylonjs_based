<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>BabylonJS Gaussian Splats Viewer with Enhanced UI and Anti-Aliasing</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <!-- Include BabylonJS Core and Loaders -->
    <!-- Versions pinned 2026-03-05 — update deliberately after testing, not automatically -->
    <!-- CDN format: cdn.babylonjs.com/v{version}/babylon.js and v{version}/loaders/... -->
    <!-- FBX loader: does NOT use Babylon version numbers — track https://www.npmjs.com/package/babylonjs-fbx-loader separately -->
    <script src="https://cdn.babylonjs.com/v8.54.0/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/v8.54.0/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs-fbx-loader@1.1.0/dist/babylonjs-fbx-loader.min.js"></script>

    <!-- Babylon.js has native GaussianSplattingMesh support since v8.0 -->

    <!-- Link to the main JavaScript file as a module -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
