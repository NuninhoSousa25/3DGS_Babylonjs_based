<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>WebGPU Detection Test</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(42, 42, 42, 0.9);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #2196f3;
            margin-top: 0;
            border-bottom: 2px solid #2196f3;
            padding-bottom: 10px;
        }

        .status {
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 18px;
            font-weight: bold;
        }

        .status.available {
            background: #4CAF50;
            color: white;
        }

        .status.unavailable {
            background: #f44336;
            color: white;
        }

        .info-section {
            background: rgba(60, 60, 60, 0.6);
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }

        .info-section h3 {
            margin-top: 0;
            color: #64B5F6;
            font-size: 16px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .label {
            color: #90CAF9;
            font-weight: 500;
        }

        .value {
            color: #E0E0E0;
        }

        .recommendation {
            background: #FF9800;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left: 4px solid #2196f3;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 WebGPU Detection Test</h1>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>Detecting WebGPU capabilities...</div>
        </div>

        <div id="results" style="display: none;"></div>
    </div>

    <script type="module">
        import { detectWebGPU, logWebGPUInfo } from './js/webgpu-detector.js';

        async function runDetection() {
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');

            try {
                // Detect WebGPU
                const gpuInfo = await detectWebGPU();

                // Log to console
                logWebGPUInfo(gpuInfo);

                // Build HTML results
                let html = '';

                // Status banner
                if (gpuInfo.available) {
                    html += `
                        <div class="status available">
                            ✅ WebGPU is AVAILABLE
                        </div>
                    `;
                } else {
                    html += `
                        <div class="status unavailable">
                            ❌ WebGPU is NOT AVAILABLE
                        </div>
                    `;
                }

                // Browser info
                html += `
                    <div class="info-section">
                        <h3>Browser Information</h3>
                        <div class="info-item">
                            <span class="label">Browser:</span>
                            <span class="value">${gpuInfo.browser.name} ${gpuInfo.browser.version}</span>
                        </div>
                    </div>
                `;

                if (gpuInfo.available) {
                    // Adapter info
                    html += `
                        <div class="info-section">
                            <h3>GPU Adapter</h3>
                            <div class="info-item">
                                <span class="label">Adapter Type:</span>
                                <span class="value">${gpuInfo.adapter}</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Vendor:</span>
                                <span class="value">${gpuInfo.adapterInfo.vendor}</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Device:</span>
                                <span class="value">${gpuInfo.adapterInfo.device}</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Architecture:</span>
                                <span class="value">${gpuInfo.adapterInfo.architecture}</span>
                            </div>
                        </div>
                    `;

                    // Device limits
                    html += `
                        <div class="info-section">
                            <h3>Device Limits</h3>
                            <div class="info-item">
                                <span class="label">Max Texture 2D:</span>
                                <span class="value">${gpuInfo.limits.maxTextureDimension2D}px</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Max Buffer Size:</span>
                                <span class="value">${(gpuInfo.limits.maxBufferSize / 1024 / 1024).toFixed(2)} MB</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Max Bind Groups:</span>
                                <span class="value">${gpuInfo.limits.maxBindGroups}</span>
                            </div>
                            <div class="info-item">
                                <span class="label">Max Compute Workgroup Size X:</span>
                                <span class="value">${gpuInfo.limits.maxComputeWorkgroupSizeX}</span>
                            </div>
                        </div>
                    `;

                    // Features
                    if (gpuInfo.features && gpuInfo.features.length > 0) {
                        html += `
                            <div class="info-section">
                                <h3>Supported Features (${gpuInfo.features.length})</h3>
                                <div class="value">${gpuInfo.features.join(', ')}</div>
                            </div>
                        `;
                    }
                } else {
                    // Error info
                    html += `
                        <div class="info-section">
                            <h3>Error Details</h3>
                            <div class="info-item">
                                <span class="label">Reason:</span>
                                <span class="value">${gpuInfo.reason}</span>
                            </div>
                        </div>
                    `;

                    if (gpuInfo.recommendation) {
                        html += `
                            <div class="recommendation">
                                <strong>💡 Recommendation:</strong><br>
                                ${gpuInfo.recommendation}
                            </div>
                        `;
                    }
                }

                // Next steps
                html += `
                    <div class="info-section">
                        <h3>Next Steps</h3>
                        <p style="margin: 10px 0;">
                            ${gpuInfo.available
                                ? '✅ Your browser supports WebGPU! Proceed to <strong>Phase 2</strong> to test rendering performance.'
                                : '⚠️ WebGPU is not available. The viewer will use WebGL as fallback.'
                            }
                        </p>
                        <p style="margin: 10px 0;">
                            Check the browser console (F12) for detailed WebGPU information.
                        </p>
                    </div>
                `;

                resultsDiv.innerHTML = html;
                loadingDiv.style.display = 'none';
                resultsDiv.style.display = 'block';

            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="status unavailable">
                        ❌ Detection Error
                    </div>
                    <div class="info-section">
                        <h3>Error</h3>
                        <div class="value">${error.message}</div>
                    </div>
                `;
                loadingDiv.style.display = 'none';
                resultsDiv.style.display = 'block';
                console.error('WebGPU detection error:', error);
            }
        }

        // Run detection when page loads
        runDetection();
    </script>
</body>
</html>
